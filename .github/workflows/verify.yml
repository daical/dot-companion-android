name: Verify foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 scripts/check_source.py
      - run: npm test && npm run demo
        working-directory: bridge

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require preinstalled Android SDK; never accept licenses
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build, unit/UI tests, and lint
        run: ./gradlew --no-daemon --max-workers=2 :core:test :mobile:assembleDebug :wear:assembleDebug :shared-ui:testDebugUnitTest :mobile:testDebugUnitTest :wear:testDebugUnitTest :shared-ui:lintDebug :mobile:lintDebug :wear:lintDebug
      - name: Record resolved runtime dependencies
        run: |
          mkdir -p build/reports/dependencies
          ./gradlew --no-daemon --max-workers=2 :mobile:dependencies --configuration debugRuntimeClasspath > build/reports/dependencies/mobile.txt
          ./gradlew --no-daemon --max-workers=2 :wear:dependencies --configuration debugRuntimeClasspath > build/reports/dependencies/wear.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-evidence-${{ github.sha }}
          retention-days: 14
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-debug.*
            **/build/outputs/screenshots/**
            build/reports/dependencies/**
