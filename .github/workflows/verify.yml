name: Verify foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python3 scripts/check_source.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: npm test && npm run demo
        working-directory: bridge

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require preinstalled Android SDK; never accept licenses
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build, unit/UI tests, and lint
        run: ./gradlew --no-daemon --max-workers=2 :core:test :mobile:assembleDebug :wear:assembleDebug :shared-ui:testDebugUnitTest :mobile:testDebugUnitTest :wear:testDebugUnitTest :shared-ui:lintDebug :mobile:lintDebug :wear:lintDebug
      - name: Record resolved runtime dependencies
        run: |
          mkdir -p build/reports/dependencies
          ./gradlew --no-daemon --max-workers=2 :mobile:dependencies --configuration debugRuntimeClasspath > build/reports/dependencies/mobile.txt
          ./gradlew --no-daemon --max-workers=2 :wear:dependencies --configuration debugRuntimeClasspath > build/reports/dependencies/wear.txt
      - name: Verify developer APK signatures and paired identity
        run: python3 scripts/verify_apks.py "$ANDROID_HOME/build-tools/35.0.0"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-evidence-${{ github.sha }}
          retention-days: 14
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-debug.*
            **/build/outputs/screenshots/**
            build/reports/dependencies/**
            build/reports/apks/**
            mobile/build/reports/licenses/**/coverage.json
            wear/build/reports/licenses/**/coverage.json
